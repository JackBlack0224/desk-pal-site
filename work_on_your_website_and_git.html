<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Work on Your Site & GitHub While You Sleep</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
    :root{
        --bg:#121212;
        --card:#1e1e1e;
        --text:#e0e0e0;
        --accent:#0ea5e9;
        --success:#10b981;
        --error:#ef4444;
    }
    body{
        margin:0;
        font-family:Arial,Helvetica,sans-serif;
        background:var(--bg);
        color:var(--text);
        display:flex;
        flex-direction:column;
        min-height:100vh;
    }
    header{
        padding:1rem 2rem;
        background:var(--card);
        display:flex;
        justify-content:space-between;
        align-items:center;
    }
    header h1{
        margin:0;
        font-size:1.5rem;
        color:var(--accent);
    }
    nav a{
        margin-left:1rem;
        color:var(--text);
        text-decoration:none;
        font-weight:500;
    }
    nav a:hover{
        color:var(--accent);
    }
    main{
        flex:1;
        padding:2rem;
        display:grid;
        grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
        gap:1.5rem;
    }
    .card{
        background:var(--card);
        border-radius:8px;
        padding:1.5rem;
        display:flex;
        flex-direction:column;
        gap:1rem;
    }
    .card h2{
        margin:0;
        font-size:1.25rem;
        color:var(--accent);
    }
    .status{
        display:flex;
        align-items:center;
        gap:.5rem;
    }
    .dot{
        width:10px;
        height:10px;
        border-radius:50%;
        background:var(--error);
    }
    .dot.online{
        background:var(--success);
    }
    button{
        padding:.5rem 1rem;
        border:none;
        border-radius:4px;
        background:var(--accent);
        color:#fff;
        cursor:pointer;
        font-weight:600;
    }
    button:disabled{
        opacity:.5;
        cursor:not-allowed;
    }
    footer{
        padding:1rem;
        text-align:center;
        background:var(--card);
        font-size:.9rem;
    }
    @media (max-width:600px){
        header,footer{
            padding:1rem;
        }
        main{
            padding:1rem;
        }
    }
</style>
</head>
<body>
<header>
    <h1>Sleepy DevOps</h1>
    <nav>
        <a href="#" id="refreshBtn">Refresh</a>
        <a href="https://github.com/yourusername/yourrepo" target="_blank">GitHub</a>
    </nav>
</header>

<main>
    <!-- System Status Card -->
    <section class="card" id="systemCard">
        <h2>System Status</h2>
        <div class="status">
            <div class="dot" id="systemDot"></div>
            <span id="systemText">Loading…</span>
        </div>
        <button id="restartBtn" disabled>Restart Services</button>
    </section>

    <!-- GitHub Actions Card -->
    <section class="card" id="githubCard">
        <h2>GitHub Workflow</h2>
        <div class="status">
            <div class="dot" id="workflowDot"></div>
            <span id="workflowText">Idle</span>
        </div>
        <button id="triggerBtn">Trigger Night Build</button>
        <pre id="logOutput" style="background:#0d0d0d;padding:.5rem;border-radius:4px;max-height:150px;overflow:auto;"></pre>
    </section>

    <!-- Chat with Desk-Pal (demo) -->
    <section class="card" id="chatCard">
        <h2>Desk‑Pal Assistant</h2>
        <div id="chatBox" style="flex:1;overflow:auto;background:#0d0d0d;padding:.5rem;border-radius:4px;height:200px;"></div>
        <input type="text" id="msgInput" placeholder="Ask something…" style="width:100%;padding:.5rem;border:none;border-radius:4px;background:#1e1e1e;color:#e0e0e0;">
        <button id="sendBtn">Send</button>
    </section>
</main>

<footer>
    © 2026 Sleepy DevOps – Automate while you dream.
</footer>

<script>
/* Utility */
function setStatus(dotId, textId, online){
    const dot=document.getElementById(dotId);
    const txt=document.getElementById(textId);
    dot.classList.toggle('online',online);
    txt.textContent=online?'Online':'Offline';
}

/* Fetch system state */
async function loadSystem(){
    try{
        const res=await fetch('/api/state');
        const data=await res.json();
        const online=data.online;
        setStatus('systemDot','systemText',online);
        document.getElementById('restartBtn').disabled=!online;
    }catch(e){
        setStatus('systemDot','systemText',false);
        console.error(e);
    }
}

/* Restart services */
document.getElementById('restartBtn').addEventListener('click',async ()=>{
    const btn=document.getElementById('restartBtn');
    btn.disabled=true;
    btn.textContent='Restarting…';
    try{
        await fetch('/api/system', {method:'POST',body:JSON.stringify({action:'restart'}),headers:{'Content-Type':'application/json'}});
        await loadSystem();
    }catch(e){console.error(e);}
    btn.textContent='Restart Services';
    btn.disabled=false;
});

/* GitHub workflow trigger */
document.getElementById('triggerBtn').addEventListener('click',async ()=>{
    const btn=document.getElementById('triggerBtn');
    btn.disabled=true;
    btn.textContent='Running…';
    const log=document.getElementById('logOutput');
    log.textContent='Starting night build...\n';
    try{
        const res=await fetch('https://api.github.com/repos/yourusername/yourrepo/dispatches',{
            method:'POST',
            headers:{
                'Accept':'application/vnd.github.v3+json',
                'Authorization':'Bearer YOUR_GITHUB_TOKEN' // replace with real token or server‑side proxy
            },
            body:JSON.stringify({event_type:'night-build'})
        });
        if(res.ok){
            log.textContent+='✅ Dispatch sent. Monitoring…\n';
            // Simulated polling (replace with real webhook listener)
            let progress=0;
            const interval=setInterval(()=>{
                progress+=20;
                log.textContent+=`... ${progress}%\n`;
                if(progress>=100){
                    clearInterval(interval);
                    setStatus('workflowDot','workflowText',true);
                    log.textContent+='✅ Build complete!\n';
                    btn.disabled=false;
                    btn.textContent='Trigger Night Build';
                }
            },800);
        }else{
            const err=await res.text();
            log.textContent+=`❌ Error: ${res.status}\\n${err}\n`;
            btn.disabled=false;
            btn.textContent='Trigger Night Build';
        }
    }catch(e){
        log.textContent+=`❌ Exception: ${e}\\n`;
        btn.disabled=false;
        btn.textContent='Trigger Night Build';
    }
});

/* Desk‑Pal chat */
async function sendMessage(msg){
    const chat=document.getElementById('chatBox');
    chat.innerHTML+=`<div style="color:#0ea5e9;">You: ${msg}</div>`;
    try{
        const res=await fetch('/api/chat',{
            method:'POST',
            headers:{'Content-Type':'application/json'},
            body:JSON.stringify({message:msg})
        });
        const data=await res.json();
        chat.innerHTML+=`<div style="color:#10b981;">Desk‑Pal: ${data.reply}</div>`;
        chat.scrollTop=chat.scrollHeight;
    }catch(e){
        chat.innerHTML+=`<div style="color:${getComputedStyle(document.documentElement).getPropertyValue('--error')};">Error contacting Desk‑Pal</div>`;
    }
}
document.getElementById('sendBtn').addEventListener('click',()=>{
    const inp=document.getElementById('msgInput');
    const txt=inp.value.trim();
    if(txt){ sendMessage(txt); inp.value='';}
});
document.getElementById('msgInput').addEventListener('keydown',e=>{
    if(e.key==='Enter'){ e.preventDefault(); document.getElementById('sendBtn').click();}
});

/* Refresh button */
document.getElementById('refreshBtn').addEventListener('click',e=>{
    e.preventDefault();
    loadSystem();
    setStatus('workflowDot','workflowText',false);
    document.getElementById('logOutput').textContent='';
});

/* Initial load */
loadSystem();
setStatus('workflowDot','workflowText',false);
</script>
</body>
</html>
